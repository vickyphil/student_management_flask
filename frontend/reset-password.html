<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main class="auth-shell"><section class="auth-card">
<h1>Set a new password</h1><p>Enter a new password for your account.</p>
<form id="reset-form" class="form-stack">
<label>New password<input id="new-password" type="password" minlength="8" required></label>
<label>Confirm password<input id="confirm-password" type="password" minlength="8" required></label>
<button class="btn btn-primary" type="submit">Reset password</button>
<div id="reset-error" class="error-box hidden"></div>
</form></section></main>
<script>
document.getElementById("reset-form").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const p=document.getElementById("new-password").value,c=document.getElementById("confirm-password").value;
 const out=document.getElementById("reset-error");
 if(p!==c){out.textContent="Passwords do not match.";out.classList.remove("hidden");return;}
 const token=new URLSearchParams(location.search).get("token");
 const r=await fetch("/api/auth/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:p})});
 const d=await r.json();
 if(!r.ok){out.textContent=d.error||"Reset failed.";out.classList.remove("hidden");return;}
 alert(d.message); location.href="/";
});
</script>
</body></html>
